    // =========================================================================
    // 2. WEB AUDIO API SYNTHESIZED SOUND & CUSTOM MP3 MUSIC ENGINE
    // =========================================================================
    class VoxelAudioManager {
      constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.musicGain = null;
        this.sfxGain = null;
        this.isPlaying = false;
        this.isMuted = false;
        this.volume = 0.55;
        this.musicTimer = null;
        this.stepIndex = 0;

        // Custom MP3 support
        // Nhạc mặc định: file assets/music.mp3 đi kèm cùng thư mục
        this.customAudio = new Audio("assets/music.mp3");
        this.customAudio.loop = true;
        this.customAudio.preload = "auto";
        this.customAudioUrl = null;
        this.trackName = "Gửi em, người bất tử – Ân Ngờ ft. Mỹ Mỹ";
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          this.ctx = new AudioCtx();

          this.masterGain = this.ctx.createGain();
          this.masterGain.gain.value = this.isMuted ? 0 : this.volume;
          this.masterGain.connect(this.ctx.destination);

          this.musicGain = this.ctx.createGain();
          this.musicGain.gain.value = 0.38;
          this.musicGain.connect(this.masterGain);

          this.sfxGain = this.ctx.createGain();
          this.sfxGain.gain.value = 0.65;
          this.sfxGain.connect(this.masterGain);
        }
        if (this.ctx && this.ctx.state === "suspended") {
          this.ctx.resume();
        }
      }

      setCustomTrack(file) {
        if (!file) return;
        this.stopMusic();

        if (this.customAudio) {
          this.customAudio.pause();
          this.customAudio.src = "";
        }
        if (this.customAudioUrl) {
          URL.revokeObjectURL(this.customAudioUrl);
        }

        const url = URL.createObjectURL(file);
        this.customAudioUrl = url;
        this.trackName = file.name.replace(/\.[^/.]+$/, "");

        const audio = new Audio(url);
        audio.loop = true;
        audio.volume = this.isMuted ? 0 : this.volume;
        this.customAudio = audio;

        this.startMusic();
      }

      setVolume(val) {
        this.volume = Math.max(0, Math.min(1, val));
        if (this.masterGain && !this.isMuted && this.ctx) {
          this.masterGain.gain.setTargetAtTime(this.volume, this.ctx.currentTime, 0.05);
        }
        if (this.customAudio) {
          this.customAudio.volume = this.isMuted ? 0 : this.volume;
        }
      }

      toggleMute() {
        this.isMuted = !this.isMuted;
        if (this.masterGain && this.ctx) {
          this.masterGain.gain.setTargetAtTime(this.isMuted ? 0 : this.volume, this.ctx.currentTime, 0.05);
        }
        if (this.customAudio) {
          this.customAudio.volume = this.isMuted ? 0 : this.volume;
        }
        return this.isMuted;
      }

      startMusic() {
        // Nếu người dùng đã tải file MP3 riêng lên thì phát MP3 đó
        if (this.customAudio) {
          this.customAudio.volume = this.isMuted ? 0 : this.volume;
          this.customAudio.play().catch((e) => console.warn("Audio play blocked:", e));
          this.isPlaying = true;
          return;
        }

        // Nhạc nền mặc định mới: Giai điệu Piano điện ấm áp & hoài niệm (Fmaj7 -> Em7 -> Dm7 -> Cmaj7)
        this.init();
        if (!this.ctx || this.isPlaying) return;
        this.isPlaying = true;

        const leadMelody = [
          659.25, 587.33, 523.25, 440.00, // E5 - D5 - C5 - A4
          392.00, 440.00, 523.25, 587.33, // G4 - A4 - C5 - D5
          493.88, 440.00, 392.00, 329.63, // B4 - A4 - G4 - E4
          293.66, 329.63, 392.00, 523.25  // D4 - E4 - G4 - C5
        ];

        const bassChords = [
          [174.61, 220.00, 261.63], // Fmaj
          [164.81, 196.00, 246.94], // Em
          [146.83, 174.61, 220.00], // Dm
          [130.81, 196.00, 246.94]  // Cmaj7
        ];

        const playStep = () => {
          if (!this.isPlaying || !this.ctx || this.customAudio) return;
          const now = this.ctx.currentTime;
          const idx = this.stepIndex % leadMelody.length;
          const freq = leadMelody[idx];

          // 1. Soft Electric Piano Lead (Triangle + Sine harmonic)
          const osc = this.ctx.createOscillator();
          const subOsc = this.ctx.createOscillator();
          const noteGain = this.ctx.createGain();

          osc.type = "triangle";
          osc.frequency.setValueAtTime(freq, now);

          subOsc.type = "sine";
          subOsc.frequency.setValueAtTime(freq * 2, now);

          const subGain = this.ctx.createGain();
          subGain.gain.value = 0.14;

          noteGain.gain.setValueAtTime(0.0001, now);
          noteGain.gain.linearRampToValueAtTime(0.16, now + 0.05);
          noteGain.gain.exponentialRampToValueAtTime(0.0001, now + 2.3);

          osc.connect(noteGain);
          subOsc.connect(subGain);
          subGain.connect(noteGain);
          noteGain.connect(this.musicGain);

          osc.start(now);
          subOsc.start(now);
          osc.stop(now + 2.4);
          subOsc.stop(now + 2.4);

          // 2. Warm Ambient Chord Pad mỗi 4 nhịp
          if (idx % 4 === 0) {
            const chord = bassChords[Math.floor(idx / 4) % bassChords.length];
            chord.forEach((chordFreq) => {
              const padOsc = this.ctx.createOscillator();
              const padGain = this.ctx.createGain();
              padOsc.type = "sine";
              padOsc.frequency.setValueAtTime(chordFreq, now);

              padGain.gain.setValueAtTime(0.0001, now);
              padGain.gain.linearRampToValueAtTime(0.065, now + 0.65);
              padGain.gain.exponentialRampToValueAtTime(0.0001, now + 4.4);

              padOsc.connect(padGain);
              padGain.connect(this.musicGain);
              padOsc.start(now);
              padOsc.stop(now + 4.5);
            });
          }

          this.stepIndex++;
          this.musicTimer = setTimeout(playStep, 1050);
        };

        playStep();
      }

      stopMusic() {
        this.isPlaying = false;
        if (this.musicTimer) {
          clearTimeout(this.musicTimer);
          this.musicTimer = null;
        }
        if (this.customAudio) {
          this.customAudio.pause();
        }
      }

      toggleMusic() {
        if (this.isPlaying) {
          this.stopMusic();
        } else {
          this.startMusic();
        }
        return this.isPlaying;
      }

      playClick() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "square";
        osc.frequency.setValueAtTime(620, now);
        osc.frequency.exponentialRampToValueAtTime(280, now + 0.06);
        gain.gain.setValueAtTime(0.16, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.065);
        osc.connect(gain);
        gain.connect(this.sfxGain);
        osc.start(now);
        osc.stop(now + 0.07);
      }

      playCollect(pitchStep = 0) {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const baseFreq = 587.33 * Math.pow(1.12, pitchStep);
        [baseFreq, baseFreq * 1.5].forEach((f, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(f, now + idx * 0.07);
          gain.gain.setValueAtTime(0.22, now + idx * 0.07);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.28);
          osc.connect(gain);
          gain.connect(this.sfxGain);
          osc.start(now + idx * 0.07);
          osc.stop(now + idx * 0.07 + 0.3);
        });
      }

      playCraft() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;

        const bufferSize = Math.floor(this.ctx.sampleRate * 1.1);
        const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = (Math.random() * 2 - 1) * Math.sin((i / bufferSize) * Math.PI);
        }
        const roar = this.ctx.createBufferSource();
        roar.buffer = noiseBuffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = "bandpass";
        filter.frequency.setValueAtTime(320, now);
        filter.frequency.exponentialRampToValueAtTime(1450, now + 0.45);
        filter.frequency.exponentialRampToValueAtTime(420, now + 1.05);

        const roarGain = this.ctx.createGain();
        roarGain.gain.setValueAtTime(0.01, now);
        roarGain.gain.linearRampToValueAtTime(0.32, now + 0.2);
        roarGain.gain.exponentialRampToValueAtTime(0.001, now + 1.08);

        roar.connect(filter);
        filter.connect(roarGain);
        roarGain.connect(this.sfxGain);
        roar.start(now);

        const notes = [440, 554.37, 659.25, 880, 1108.73, 1318.51];
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, now + 0.18 + idx * 0.09);
          gain.gain.setValueAtTime(0.001, now + 0.18 + idx * 0.09);
          gain.gain.linearRampToValueAtTime(0.24, now + 0.18 + idx * 0.09 + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18 + idx * 0.09 + 0.65);
          osc.connect(gain);
          gain.connect(this.sfxGain);
          osc.start(now + 0.18 + idx * 0.09);
          osc.stop(now + 0.18 + idx * 0.09 + 0.7);
        });
      }

      playChestOpen() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const creak = this.ctx.createOscillator();
        const creakGain = this.ctx.createGain();
        creak.type = "sawtooth";
        creak.frequency.setValueAtTime(140, now);
        creak.frequency.linearRampToValueAtTime(240, now + 0.28);
        creakGain.gain.setValueAtTime(0.14, now);
        creakGain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        creak.connect(creakGain);
        creakGain.connect(this.sfxGain);
        creak.start(now);
        creak.stop(now + 0.32);

        const chord = [523.25, 659.25, 783.99, 1046.50];
        chord.forEach((f, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(f, now + 0.22 + i * 0.05);
          gain.gain.setValueAtTime(0.2, now + 0.22 + i * 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
          osc.connect(gain);
          gain.connect(this.sfxGain);
          osc.start(now + 0.22 + i * 0.05);
          osc.stop(now + 1.25);
        });
      }

      playPageFlip() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(780, now + 0.11);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
        osc.connect(gain);
        gain.connect(this.sfxGain);
        osc.start(now);
        osc.stop(now + 0.14);
      }

      playFirework() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        [0, 0.25, 0.5].forEach((offset, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(523.25 + idx * 130, now + offset);
          osc.frequency.exponentialRampToValueAtTime(1046.5 + idx * 200, now + offset + 0.25);
          gain.gain.setValueAtTime(0.22, now + offset);
          gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.45);
          osc.connect(gain);
          gain.connect(this.sfxGain);
          osc.start(now + offset);
          osc.stop(now + offset + 0.48);
        });
      }
    }

    // =========================================================================
    // 3. PIXEL FIREWORKS OVERLAY (Celebration on ACCEPT INVITATION)
    // =========================================================================
    function PixelFireworksCanvas({ active }) {
      const canvasRef = useRef(null);

      useEffect(() => {
        if (!active) return;
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        let animId;
        let particles = [];
        const colors = ["#10B981", "#FBBF24", "#22D3EE", "#A855F7", "#F8FAFC"];

        const resize = () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        };
        resize();
        window.addEventListener("resize", resize);

        const spawnBurst = (x, y) => {
          for (let i = 0; i < 42; i++) {
            const angle = (Math.PI * 2 * i) / 42 + (Math.random() - 0.5) * 0.2;
            const speed = 2.5 + Math.random() * 5.5;
            particles.push({
              x,
              y,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed,
              size: 5 + Math.floor(Math.random() * 5),
              color: colors[Math.floor(Math.random() * colors.length)],
              alpha: 1,
              decay: 0.013 + Math.random() * 0.01
            });
          }
        };

        spawnBurst(canvas.width * 0.28, canvas.height * 0.35);
        spawnBurst(canvas.width * 0.72, canvas.height * 0.32);
        const burstTimer1 = setTimeout(() => spawnBurst(canvas.width * 0.5, canvas.height * 0.26), 380);
        const burstTimer2 = setTimeout(() => spawnBurst(canvas.width * 0.35, canvas.height * 0.45), 760);
        const burstTimer3 = setTimeout(() => spawnBurst(canvas.width * 0.65, canvas.height * 0.42), 1100);

        const render = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          particles.forEach((p) => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.08;
            p.alpha -= p.decay;
            if (p.alpha > 0) {
              ctx.globalAlpha = p.alpha;
              ctx.fillStyle = p.color;
              ctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
            }
          });
          particles = particles.filter((p) => p.alpha > 0);
          if (particles.length > 0) {
            animId = requestAnimationFrame(render);
          }
        };
        render();

        return () => {
          cancelAnimationFrame(animId);
          clearTimeout(burstTimer1);
          clearTimeout(burstTimer2);
          clearTimeout(burstTimer3);
          window.removeEventListener("resize", resize);
        };
      }, [active]);

      if (!active) return null;
      return (
        <canvas
          ref={canvasRef}
          className="fixed inset-0 pointer-events-none z-50"
        />
      );
    }

        const makePixelCanvas = (drawFn) => {
          const canvas = document.createElement("canvas");
          canvas.width = 16;
          canvas.height = 16;
          const ctx = canvas.getContext("2d");
          drawFn(ctx);
          const tex = new THREE.CanvasTexture(canvas);
          tex.magFilter = THREE.NearestFilter;
          tex.minFilter = THREE.NearestFilter;
          tex.encoding = THREE.sRGBEncoding;
          return tex;
        };

        const seededNoise = (x, y, seed = 1) => {
          const n = Math.sin(x * 12.9898 + y * 78.233 + seed * 43.12) * 43758.5453;
          return n - Math.floor(n);
        };

        const grassTopTex = makePixelCanvas((ctx) => {
          const greens = ["#4C9A2A", "#5BB334", "#3E8422", "#68C13E", "#468E26"];
          for (let y = 0; y < 16; y++) {
            for (let x = 0; x < 16; x++) {
              ctx.fillStyle = greens[Math.floor(seededNoise(x, y, 2) * greens.length)];
              ctx.fillRect(x, y, 1, 1);
            }
          }
        });

        const dirtTex = makePixelCanvas((ctx) => {
          const browns = ["#6E4B32", "#5D3E29", "#7C563A", "#523623", "#845C3F"];
          for (let y = 0; y < 16; y++) {
            for (let x = 0; x < 16; x++) {
              const r = seededNoise(x, y, 5);
              ctx.fillStyle = r > 0.92 ? "#7A7A7A" : browns[Math.floor(r * browns.length)];
              ctx.fillRect(x, y, 1, 1);
            }
          }
        });

        const grassSideTex = makePixelCanvas((ctx) => {
          const browns = ["#6E4B32", "#5D3E29", "#7C563A", "#523623"];
          const greens = ["#4C9A2A", "#5BB334", "#3E8422", "#68C13E"];
          for (let y = 0; y < 16; y++) {
            for (let x = 0; x < 16; x++) {
              const r = seededNoise(x, y, 9);
              const fringeDepth = 3 + Math.floor(seededNoise(x, 0, 11) * 3);
              if (y < fringeDepth) {
                ctx.fillStyle = greens[Math.floor(r * greens.length)];
              } else if (y === fringeDepth && r > 0.45) {
                ctx.fillStyle = "#35701C";
              } else {
                ctx.fillStyle = r > 0.93 ? "#7A7A7A" : browns[Math.floor(r * browns.length)];

              ctx.fillRect(x, y, 1, 1);

        const enchantBase = new THREE.Mesh(
          new THREE.BoxGeometry(1, 0.75, 1),

        );
        enchantBase.position.set(-3.2, 0.875, -1.2);
        enchantBase.castShadow = true;
        labGroup.add(enchantBase);

        const enchantCloth = new THREE.Mesh(
          new THREE.BoxGeometry(0.88, 0.06, 0.88),
          new THREE.MeshStandardMaterial({ color: 0xb91c1c, roughness: 0.6 })
        );
        enchantCloth.position.set(-3.2, 1.27, -1.2);
        labGroup.add(enchantCloth);

        const enchantBook = new THREE.Mesh(
          new THREE.BoxGeometry(0.55, 0.14, 0.4),
          new THREE.MeshStandardMaterial({ color: 0xfbbf24, emissive: 0x92400e, emissiveIntensity: 0.45 })
        );
        enchantBook.position.set(-3.2, 1.65, -1.2);
        enchantBook.rotation.z = 0.25;
        labGroup.add(enchantBook);

        const cauldron = new THREE.Mesh(
          new THREE.BoxGeometry(1.15, 0.95, 1.15),
          new THREE.MeshStandardMaterial({ map: stoneTex, color: 0x334155, roughness: 0.45, metalness: 0.65 })
        );
        cauldron.position.set(3.2, 0.975, -1.2);
        cauldron.castShadow = true;
        labGroup.add(cauldron);

        const thermiteCrucibleCore = new THREE.Mesh(
          new THREE.BoxGeometry(0.88, 0.12, 0.88),
          new THREE.MeshBasicMaterial({ color: 0xf59e0b })
        );
        thermiteCrucibleCore.position.set(3.2, 1.42, -1.2);
        labGroup.add(thermiteCrucibleCore);

        const crystalMeshes = [];
        const crystalConfigs = [
          { pos: [-5.2, 1.4, 1.5], color: 0x38bdf8, scale: 0.9 },
          { pos: [5.2, 1.5, 1.2], color: 0xc084fc, scale: 1.0 },
          { pos: [-4.8, 1.3, -4.5], color: 0x10b981, scale: 0.85 },
          { pos: [4.8, 1.6, -4.5], color: 0xfbbf24, scale: 0.95 }
        ];
        crystalConfigs.forEach((cfg) => {
          const cMesh = new THREE.Mesh(
            new THREE.OctahedronGeometry(0.55 * cfg.scale, 0),
            new THREE.MeshStandardMaterial({
              color: cfg.color,
              emissive: cfg.color,
              emissiveIntensity: 0.75,
              roughness: 0.15
            })
          );
          cMesh.position.set(...cfg.pos);
          labGroup.add(cMesh);
          crystalMeshes.push(cMesh);
        });

        const interactiveObjects = [];

        const createReactantOrb = (symbol, displayLabel, hexColor, position) => {
          const group = new THREE.Group();
          group.position.set(...position);

          const orbMat = new THREE.MeshStandardMaterial({
            color: hexColor,
            emissive: hexColor,
            emissiveIntensity: 0.8,
            roughness: 0.2,
            metalness: 0.25
          });
          const orbMesh = new THREE.Mesh(new THREE.OctahedronGeometry(0.52, 0), orbMat);
          orbMesh.userData = { interactType: "element", symbol };
          group.add(orbMesh);

          const frameMesh = new THREE.Mesh(
            new THREE.BoxGeometry(0.88, 0.88, 0.88),
            new THREE.MeshBasicMaterial({ color: hexColor, wireframe: true })
          );
          frameMesh.userData = { interactType: "element", symbol };
          group.add(frameMesh);

          const badgeCanvas = document.createElement("canvas");
          badgeCanvas.width = 192;
          badgeCanvas.height = 128;
          const bCtx = badgeCanvas.getContext("2d");
          bCtx.fillStyle = "rgba(7, 11, 25, 0.9)";
          bCtx.fillRect(12, 16, 168, 96);
          bCtx.strokeStyle = hexColor;
          bCtx.lineWidth = 8;
          bCtx.strokeRect(12, 16, 168, 96);
          bCtx.fillStyle = "#F8FAFC";
          bCtx.font = "bold 44px monospace";
          bCtx.textAlign = "center";
          bCtx.textBaseline = "middle";
          bCtx.fillText(displayLabel, 96, 66);

          const spriteTex = new THREE.CanvasTexture(badgeCanvas);
          const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: spriteTex }));
          sprite.scale.set(1.55, 1.05, 1);
          sprite.position.set(0, 1.18, 0);
          sprite.userData = { interactType: "element", symbol };
          group.add(sprite);

          scene.add(group);
          interactiveObjects.push(orbMesh, frameMesh, sprite);
          return { group, orbMesh, frameMesh, baseY: position[1] };
        };

        const elementOrbs = {
          Al: createReactantOrb("Al", "Al", "#38BDF8", [-2.7, 2.2, 1.6]),
          Fe2O3: createReactantOrb("Fe2O3", "Fe₂O₃", "#F97316", [0, 2.6, -2.5]),
          Mg: createReactantOrb("Mg", "Mg", "#FBBF24", [2.7, 2.2, 1.6])
        };

        const craftingTable = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), craftingMaterials);
        craftingTable.position.set(0, 1.1, -1.2);
        craftingTable.castShadow = true;
        craftingTable.receiveShadow = true;
        craftingTable.userData = { interactType: "crafting" };
        scene.add(craftingTable);
        interactiveObjects.push(craftingTable);

        const craftingGlowRing = new THREE.Mesh(
          new THREE.RingGeometry(0.85, 1.08, 4),
          new THREE.MeshBasicMaterial({ color: 0xfbbf24, side: THREE.DoubleSide, transparent: true, opacity: 0 })
        );
        craftingGlowRing.rotation.x = -Math.PI / 2;
        craftingGlowRing.position.set(0, 0.52, -1.2);
        scene.add(craftingGlowRing);

        const chestGroup = new THREE.Group();
        chestGroup.position.set(0, 0.5, 1.3);
        scene.add(chestGroup);

        const chestTrimMat = new THREE.MeshStandardMaterial({
          color: 0xfbbf24,
          emissive: 0xd97706,
          emissiveIntensity: 0.4,
          roughness: 0.25,
          metalness: 0.75
        });
        const emeraldCoreMat = new THREE.MeshStandardMaterial({
          color: 0x10b981,
          emissive: 0x10b981,
          emissiveIntensity: 0.95
        });

        const chestBase = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.75, 1.0), chestMat);
        chestBase.position.set(0, 0.375, 0);
        chestBase.castShadow = true;
        chestBase.userData = { interactType: "chest" };
        chestGroup.add(chestBase);

        const chestBand = new THREE.Mesh(new THREE.BoxGeometry(1.44, 0.14, 1.04), chestTrimMat);
        chestBand.position.set(0, 0.72, 0);
        chestBand.userData = { interactType: "chest" };
        chestGroup.add(chestBand);

        const lidPivot = new THREE.Group();
        lidPivot.position.set(0, 0.75, -0.5);
        chestGroup.add(lidPivot);

        const chestLid = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.36, 1.0), chestMat);
        chestLid.position.set(0, 0.18, 0.5);
        chestLid.castShadow = true;
        chestLid.userData = { interactType: "chest" };
        lidPivot.add(chestLid);

        const chestLatch = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.32, 0.12), emeraldCoreMat);
        chestLatch.position.set(0, 0.04, 1.02);
        chestLatch.userData = { interactType: "chest" };
        lidPivot.add(chestLatch);

        const chestCore = new THREE.Mesh(new THREE.OctahedronGeometry(0.32, 0), emeraldCoreMat);
        chestCore.position.set(0, 0.65, 0);
        chestGroup.add(chestCore);

        interactiveObjects.push(chestBase, chestBand, chestLid, chestLatch);

        const particleCount = 190;
        const pGeo = new THREE.BufferGeometry();
        const pPositions = new Float32Array(particleCount * 3);
        const pColors = new Float32Array(particleCount * 3);
        const colorPalette = [
          new THREE.Color(0xfbbf24),
          new THREE.Color(0xf97316),
          new THREE.Color(0x10b981),
          new THREE.Color(0xfef08a)
        ];

        for (let i = 0; i < particleCount; i++) {
          pPositions[i * 3] = (Math.random() - 0.5) * 24;
          pPositions[i * 3 + 1] = 0.8 + Math.random() * 11;
          pPositions[i * 3 + 2] = (Math.random() - 0.5) * 24;

          const col = colorPalette[i % colorPalette.length];
          pColors[i * 3] = col.r;
          pColors[i * 3 + 1] = col.g;
          pColors[i * 3 + 2] = col.b;
        }
        pGeo.setAttribute("position", new THREE.BufferAttribute(pPositions, 3));
        pGeo.setAttribute("color", new THREE.BufferAttribute(pColors, 3));

        const pMat = new THREE.PointsMaterial({
          size: 0.2,
          vertexColors: true,
          transparent: true,
          opacity: 0.9
        });
        const particles = new THREE.Points(pGeo, pMat);
        scene.add(particles);

        const mcFireTex = makePixelCanvas((ctx) => {
          ctx.clearRect(0, 0, 16, 16);
          ctx.fillStyle = "#F59E0B";
          ctx.fillRect(5, 2, 6, 12);
          ctx.fillRect(3, 6, 10, 7);
          ctx.fillRect(4, 13, 8, 2);
          ctx.fillStyle = "#FDE047";
          ctx.fillRect(6, 4, 4, 9);
          ctx.fillRect(5, 8, 6, 5);
          ctx.fillStyle = "#FFFBEB";
          ctx.fillRect(7, 7, 2, 5);
          ctx.fillStyle = "#DC2626";
          ctx.fillRect(4, 3, 1, 3);
          ctx.fillRect(11, 5, 1, 3);
        });

        const firePlumeGroup = new THREE.Group();
        firePlumeGroup.position.set(0, 1.8, -1.2);
        firePlumeGroup.visible = false;
        scene.add(firePlumeGroup);

        const fireSprites = [];
        for (let i = 0; i < 18; i++) {
          const sMat = new THREE.SpriteMaterial({
            map: mcFireTex,
            transparent: true,
            opacity: 0.95,
            blending: THREE.AdditiveBlending,
            depthWrite: false
          });
          const spr = new THREE.Sprite(sMat);
          const angle = (Math.PI * 2 * i) / 18;
          const rad = 0.25 + (i % 4) * 0.28;
          spr.position.set(Math.cos(angle) * rad, (i % 5) * 0.45, Math.sin(angle) * rad);
          const baseScale = 1.1 + (i % 3) * 0.55;
          spr.scale.set(baseScale, baseScale * 1.25, 1);
          spr.userData = {
            angle,
            rad,
            phase: i * 0.65,
            baseScale
          };
          firePlumeGroup.add(spr);
          fireSprites.push(spr);
        }

        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        let isDragging = false;
        let prevPointer = { x: 0, y: 0 };
        let userYawOffset = 0;
        let userPitchOffset = 0;

        const updatePointerCoords = (clientX, clientY) => {
          const rect = renderer.domElement.getBoundingClientRect();
          pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
          pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
        };

        const handlePointerDown = (e) => {
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const clientY = e.touches ? e.touches[0].clientY : e.clientY;
          isDragging = true;
          prevPointer = { x: clientX, y: clientY };
        };

        const handlePointerMove = (e) => {
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const clientY = e.touches ? e.touches[0].clientY : e.clientY;

          if (isDragging) {
            const dx = clientX - prevPointer.x;
            const dy = clientY - prevPointer.y;
            userYawOffset = Math.max(-0.85, Math.min(0.85, userYawOffset - dx * 0.0045));
            userPitchOffset = Math.max(-0.35, Math.min(0.45, userPitchOffset + dy * 0.004));
            prevPointer = { x: clientX, y: clientY };
          } else if (!e.touches) {
            updatePointerCoords(clientX, clientY);
            raycaster.setFromCamera(pointer, camera);
            const hits = raycaster.intersectObjects(interactiveObjects, false);
            renderer.domElement.style.cursor = hits.length > 0 ? "pointer" : "grab";
          }
        };

        const handlePointerUp = () => {
          isDragging = false;
        };

        const handleCanvasClick = (e) => {
          const current = sceneStateRef.current;
          if (current.stage === "intro") return;

          updatePointerCoords(e.clientX, e.clientY);
          raycaster.setFromCamera(pointer, camera);
          const hits = raycaster.intersectObjects(interactiveObjects, false);

          if (hits.length > 0) {
            const hitData = hits[0].object.userData;
            if (hitData.interactType === "element") {
              current.onCollectElement(hitData.symbol);
            } else if (hitData.interactType === "crafting") {
              current.onClickCraftingTable();
            } else if (hitData.interactType === "chest") {
              current.onOpenChest();
            }
          }
        };

        const domElem = renderer.domElement;
        domElem.addEventListener("mousedown", handlePointerDown);
        window.addEventListener("mousemove", handlePointerMove);
        window.addEventListener("mouseup", handlePointerUp);
        domElem.addEventListener("touchstart", handlePointerDown, { passive: true });
        window.addEventListener("touchmove", handlePointerMove, { passive: true });
        window.addEventListener("touchend", handlePointerUp);
        domElem.addEventListener("click", handleCanvasClick);

        const handleResize = () => {
          if (!container) return;
          width = container.clientWidth || window.innerWidth;
          height = container.clientHeight || window.innerHeight;
          camera.aspect = width / height;
          camera.updateProjectionMatrix();
          renderer.setSize(width, height);
        };
        window.addEventListener("resize", handleResize);

        let animFrameId;
        const clock = new THREE.Clock();
        const targetCamPos = new THREE.Vector3();
        const targetLookAt = new THREE.Vector3(0, 1.5, 0);
        const skyColorTarget = new THREE.Color(0x0b1528);
        const sunColorTarget = new THREE.Color(0xfde68a);

        const animate = () => {
          animFrameId = requestAnimationFrame(animate);
          const elapsed = clock.getElapsedTime();
          const current = sceneStateRef.current;

          if (current.skyMood === "golden") {
            skyColorTarget.setHex(0x271710);
            sunColorTarget.setHex(0xfb923c);
            beamMat.opacity = 0.085;
          } else if (current.skyMood === "night") {
            skyColorTarget.setHex(0x060916);
            sunColorTarget.setHex(0x818cf8);
            beamMat.opacity = 0.025;
          } else {
            skyColorTarget.setHex(0x0b172a);
            sunColorTarget.setHex(0xfde68a);
            beamMat.opacity = 0.06;
          }
          scene.background.lerp(skyColorTarget, 0.03);
          scene.fog.color.lerp(skyColorTarget, 0.03);
          sunLight.color.lerp(sunColorTarget, 0.03);

          cloudGroup.children.forEach((cloud, idx) => {
            cloud.position.x += 0.008 * (idx % 2 === 0 ? 1 : 0.7);
            if (cloud.position.x > 18) cloud.position.x = -18;
          });

          crystalMeshes.forEach((c, idx) => {
            c.rotation.y = elapsed * 0.8 + idx;
            c.position.y += Math.sin(elapsed * 2 + idx) * 0.0025;
          });
          enchantBook.rotation.y = elapsed * 1.1;
          enchantBook.position.y = 1.65 + Math.sin(elapsed * 2.5) * 0.08;

          Object.entries(elementOrbs).forEach(([sym, obj], idx) => {
            const isCollected = current.collectedElements.includes(sym);
            obj.group.visible = !isCollected;
            if (!isCollected) {
              obj.group.position.y = obj.baseY + Math.sin(elapsed * 2.4 + idx * 1.4) * 0.22;
              obj.orbMesh.rotation.y = elapsed * 1.6;
              obj.frameMesh.rotation.x = elapsed * 0.9;
              obj.frameMesh.rotation.z = elapsed * 0.7;
            }
          });

          const allCollected = current.collectedElements.length >= 3;
          craftingGlowRing.material.opacity = allCollected ? 0.6 + Math.sin(elapsed * 6) * 0.35 : 0;
          craftingGlowRing.rotation.z = elapsed * 1.8;

          const isThermiteActive =
            current.stage === "thermite_ignited" ||
            current.stage === "crafted" ||
            current.stage === "chest_opened" ||
            current.stage === "celebrate";

          if (current.stage === "thermite_ignited") {
            thermiteLight.intensity = 5.5 + Math.sin(elapsed * 28) * 1.8;
            thermiteCrucibleCore.material.color.setHex(0xffffff);
            firePlumeGroup.visible = true;
            fireSprites.forEach((spr) => {
              const { phase, baseScale } = spr.userData;
              const cycle = ((elapsed * 2.2 + phase) % 1);
              spr.position.y = cycle * 4.4;
              const spread = 0.25 + cycle * 1.45;
              spr.position.x = Math.cos(spr.userData.angle + elapsed * 1.5) * spread;
              spr.position.z = Math.sin(spr.userData.angle + elapsed * 1.5) * spread;
              const s = baseScale * (1.25 - cycle * 0.55);
              spr.scale.set(s, s * 1.3, 1);
              spr.material.opacity = Math.max(0, (1 - cycle) * 0.98);
            });
          } else {
            firePlumeGroup.visible = false;
            if (isThermiteActive) {
              thermiteLight.intensity = 2.2 + Math.sin(elapsed * 6) * 0.5;
              thermiteCrucibleCore.material.color.setHex(0xfbbf24);
            } else {
              thermiteLight.intensity = current.stage === "intro" ? 0.45 : 1.1;
              thermiteCrucibleCore.material.color.setHex(0xf97316);
            }
          }

          const chestUnlocked =
            current.stage === "crafted" ||
            current.stage === "chest_opened" ||
            current.stage === "celebrate";

          chestGroup.visible = chestUnlocked;
          if (chestUnlocked) {
            const isOpened = current.stage === "chest_opened" || current.stage === "celebrate";
            const targetLidAngle = isOpened ? -1.15 : 0;
            lidPivot.rotation.x += (targetLidAngle - lidPivot.rotation.x) * 0.08;
            goldChestLight.intensity += ((isOpened ? 3.5 : 1.3) - goldChestLight.intensity) * 0.08;
            chestCore.rotation.y = elapsed * 2.2;
            chestCore.position.y = isOpened ? 1.15 + Math.sin(elapsed * 3) * 0.1 : 0.65;
          } else {
            goldChestLight.intensity = 0;
          }

          const posAttr = particles.geometry.attributes.position;
          for (let i = 0; i < particleCount; i++) {
            let py = posAttr.getY(i);
            const speed =
              current.stage === "thermite_ignited"
                ? 0.095
                : current.stage === "celebrate"
                ? 0.055
                : 0.015;
            py += speed;
            if (py > 12) py = 0.8;
            posAttr.setY(i, py);
          }
          posAttr.needsUpdate = true;
          particles.rotation.y = elapsed * 0.08;

          if (current.stage === "intro") {
            const angle = elapsed * 0.18;
            targetCamPos.set(Math.sin(angle) * 16.5, 9.2 + Math.sin(elapsed * 0.4) * 0.8, Math.cos(angle) * 16.5);
            targetLookAt.set(0, 1.8, 0);
          } else if (current.stage === "thermite_ignited") {
            targetCamPos.set(0, 3.8, 6.2);
            targetLookAt.set(0, 1.6, -1.2);
          } else if (current.stage === "chest_opened" || current.stage === "celebrate") {
            const radius = 5.4;
            targetCamPos.set(
              Math.sin(userYawOffset) * radius,
              3.2 + userPitchOffset * 3,
              1.3 + Math.cos(userYawOffset) * radius
            );
            targetLookAt.set(0, 1.3, 1.0);
          } else {
            const radius = 8.4;
            targetCamPos.set(
              Math.sin(userYawOffset) * radius,
              4.3 + userPitchOffset * 4,
              Math.cos(userYawOffset) * radius
            );
            targetLookAt.set(0, 1.4, -0.3);
          }

          camera.position.lerp(targetCamPos, 0.048);
          camera.lookAt(targetLookAt);

          renderer.render(scene, camera);
        };

        animate();

        return () => {
          cancelAnimationFrame(animFrameId);
          domElem.removeEventListener("mousedown", handlePointerDown);
          window.removeEventListener("mousemove", handlePointerMove);
          window.removeEventListener("mouseup", handlePointerUp);
          domElem.removeEventListener("touchstart", handlePointerDown);
          window.removeEventListener("touchmove", handlePointerMove);
          window.removeEventListener("touchend", handlePointerUp);
          domElem.removeEventListener("click", handleCanvasClick);
          window.removeEventListener("resize", handleResize);
          renderer.dispose();
        };
      }, [lowGraphics]);

      if (lowGraphics) {
        return (
          <div className="w-full h-full bg-gradient-to-b from-[#070B19] via-[#0D1A2D] to-[#070B19] flex items-center justify-center relative overflow-hidden">
            <div className="absolute inset-0 opacity-20" style={{
              backgroundImage: "radial-gradient(#10B981 1.5px, transparent 1.5px)",
              backgroundSize: "24px 24px"
            }} />
            <div className="text-center px-6 z-10 max-w-lg">
              <div className="inline-block px-3 py-1 mb-3 rounded bg-amber-500/20 border border-amber-400/40 font-pixel text-xs text-amber-300">
                2D EDITORIAL / LOW GRAPHICS MODE ACTIVE
              </div>
              <p className="text-slate-300 text-sm">
                Chế độ tiết kiệm cấu hình đang bật. Bạn vẫn có thể kích hoạt Phản ứng Nhiệt Nhôm (Al + Fe₂O₃ + Mg), mở rương thiệp mời và khám phá toàn bộ nội dung mượt mà.
              </p>
            </div>
          </div>
        );
      }

      return <div ref={mountRef} className="w-full h-full" />;
    }

    // =========================================================================
    // 5. TOP CONTROL HUD & AUDIO / GRAPHICS BAR (WITH CUSTOM MP3 UPLOAD)

    // =========================================================================
    // 7. REAL-TIME COUNTDOWN SECTION (UTC+7 Target: 29/11/2026 07:30:00)
    // =========================================================================
    function CountdownSection() {
      const computeTimeState = () => {
        const now = Date.now();
        const startMs = new Date(INVITATION_CONFIG.targetStartISO).getTime();
        const endMs = new Date(INVITATION_CONFIG.targetEndISO).getTime();

        if (now >= endMs) {
          return { status: "ENDED", days: 0, hours: 0, minutes: 0, seconds: 0 };
        }
        if (now >= startMs) {
          return { status: "LIVE", days: 0, hours: 0, minutes: 0, seconds: 0 };
        }

        const diff = Math.max(0, startMs - now);
        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((diff / (1000 * 60)) % 60);
        const seconds = Math.floor((diff / 1000) % 60);
        return { status: "COUNTING", days, hours, minutes, seconds };
      };

      const [timeState, setTimeState] = useState(computeTimeState);

      useEffect(() => {
        const timer = setInterval(() => {
          setTimeState(computeTimeState());
        }, 1000);
        return () => clearInterval(timer);
      }, []);

      const pad2 = (n) => String(n).padStart(2, "0");

      return (
        <section id="countdown-section" className="relative py-20 px-4 sm:px-6">
          <div className="max-w-5xl mx-auto">
            <div className="voxel-panel rounded-3xl p-6 sm:p-10 border-2 border-cyan-400/35 text-center">
              <div className="inline-block px-3.5 py-1 rounded-full bg-cyan-400/15 border border-cyan-400/35 font-pixel text-[11px] text-cyan-300 mb-3">
                REAL-TIME CHRONOMETER • UTC+7
              </div>

              <h2 className="font-pixel text-xl sm:text-3xl text-warmWhite mb-2">
                COUNTDOWN TO {INVITATION_CONFIG.dateDisplay} • {INVITATION_CONFIG.startTime}
              </h2>
              <p className="text-slate-400 text-sm mb-8">
                Hành trình tại <span className="text-warmWhite font-semibold">{INVITATION_CONFIG.location}</span> cùng{" "}
                <span className="text-emerald-300 font-semibold">{INVITATION_CONFIG.organizer}</span>
              </p>

              {timeState.status === "LIVE" && (
                <div className="py-8 px-4 rounded-2xl bg-emerald-500/20 border-2 border-emerald-400 animate-pulse">
                  <div className="font-pixel text-2xl sm:text-4xl text-emerald-300">
                    THE BIG DAY IS HERE!
                  </div>
                </div>
              )}

              {timeState.status === "ENDED" && (
                <div className="py-8 px-4 rounded-2xl bg-purple-500/20 border-2 border-purple-400">
                  <div className="font-pixel text-2xl sm:text-4xl text-purple-200">
                    THANK YOU FOR THE MEMORIES!
                  </div>
                </div>
              )}

              {timeState.status === "COUNTING" && (
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 sm:gap-6">
                  {[
                    { label: "DAYS", value: timeState.days, accent: "border-emerald-400/50 text-emerald-300" },
                    { label: "HOURS", value: pad2(timeState.hours), accent: "border-cyan-400/50 text-cyan-300" },
                    { label: "MINUTES", value: pad2(timeState.minutes), accent: "border-purple-400/50 text-purple-300" },
                    { label: "SECONDS", value: pad2(timeState.seconds), accent: "border-amber-400/50 text-amber-300" }
                  ].map((unit) => (
                    <div
                      key={unit.label}
                      className={`rounded-2xl bg-slate-900/85 border-2 ${unit.accent} p-5 sm:p-7 shadow-lg flex flex-col items-center justify-center`}
                    >
                      <div
                        key={`${unit.label}-${unit.value}`}
                        className="font-pixel text-3xl sm:text-5xl md:text-6xl text-warmWhite digit-pop mb-2"
                      >
                        {unit.value}
                      </div>
                      <div className={`font-pixel text-xs sm:text-sm tracking-widest ${unit.accent.split(" ")[1]}`}>
                        {unit.label}
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        </section>
      );
    }

          const totalDist = rect.height - winH;
          if (totalDist > 0) {
            const prog = Math.min(100, Math.max(0, ((-rect.top) / totalDist) * 100));
            setScrollProgress(Math.round(prog));

        INVITATION_CONFIG.gallerySlots.forEach((item) => {
          const url = `assets/photos/${item.id}.jpg`;
          const probe = new Image();
          probe.onload = () =>
            setSlots((prev) =>
              prev.map((s) => (s.id === item.id && !s.customImageUrl ? { ...s, customImageUrl: url } : s))
            );
          probe.src = url;
        });

        const file = e.target.files?.[0];
        if (!file) return;
        const objectUrl = URL.createObjectURL(file);
        setSlots((prev) =>
          prev.map((s) => (s.id === slotId ? { ...s, customImageUrl: objectUrl } : s))
        );
        soundEngine.playCollect(2);

        const file = e.target.files?.[0];
        if (!file) return;

    // =========================================================================
    // 11. MAIN APPLICATION COMPONENT
    // =========================================================================
    function App() {
      const [stage, setStage] = useState("intro");
      const [collectedElements, setCollectedElements] = useState([]);
      const [lowGraphics, setLowGraphics] = useState(false);
      const [isPlaying, setIsPlaying] = useState(false);
      const [isMuted, setIsMuted] = useState(false);
      const [volume, setVolume] = useState(0.55);
      const [trackName, setTrackName] = useState(soundEngine.trackName);
      const [accepted, setAccepted] = useState(false);
      const [copiedToast, setCopiedToast] = useState(false);
      const [fireworksActive, setFireworksActive] = useState(false);
      const [questFeedback, setQuestFeedback] = useState("");
      const [postBurnQuoteVisible, setPostBurnQuoteVisible] = useState(false);
      const [skyMood, setSkyMood] = useState("dawn");

      const allElementsCollected = collectedElements.length >= 3;

      const handleEnterWorld = () => {
        soundEngine.playClick();
        soundEngine.startMusic();
        setIsPlaying(true);
        setStage("lab");
        setPostBurnQuoteVisible(false);
        setQuestFeedback(
          "Thí nghiệm Nhiệt Nhôm: Hãy thu thập đủ [Al], [Fe₂O₃] và dải mồi [Mg] đang bay lơ lửng!"
        );
      };

      const handleUploadMp3 = (file) => {
        soundEngine.setCustomTrack(file);
        setTrackName(soundEngine.trackName);
        setIsPlaying(true);
        if (stage !== "intro") {
          setQuestFeedback(`🎵 Đã thay nhạc nền sang: "${soundEngine.trackName}"`);
        }
      };

      const handleCollectElement = useCallback((symbol) => {
        setCollectedElements((prev) => {
          if (prev.includes(symbol)) return prev;
          const next = [...prev, symbol];
          soundEngine.playCollect(next.length - 1);
          const displayMap = { Al: "Al", Fe2O3: "Fe₂O₃", Mg: "Mg" };
          if (next.length === 3) {
            setQuestFeedback(
              "Đã đủ Al + Fe₂O₃ + Mg! Nhấn vào Bàn Chế Tạo (Crafting Table) để châm ngòi Phản ứng Nhiệt Nhôm!"
            );
          } else {
            setQuestFeedback(`Đã thu thập chất phản ứng [${displayMap[symbol] || symbol}] (${next.length}/3)!`);
          }
          return next;
        });
      }, []);

      const handleSynthesize = useCallback(() => {
        if (collectedElements.length < 3) {
          soundEngine.playClick();
          setQuestFeedback("Bạn cần thu thập đủ Al, Fe₂O₃ và Mg trước khi châm ngòi phản ứng!");
          return;
        }
        soundEngine.playCraft();
        setPostBurnQuoteVisible(false);
        setStage("thermite_ignited");
        setQuestFeedback("🔥 BÙNG LỬA NHIỆT NHÔM (2500°C): 2Al + Fe₂O₃ → Al₂O₃ + 2Fe! Đang chuyển hóa...");

        setTimeout(() => {
          setStage("crafted");
          setPostBurnQuoteVisible(true);
          setQuestFeedback(
            "Phản ứng đã cháy xong & chuyển hóa hoàn tất! Rương Kho Báu đã xuất hiện — hãy click để mở thiệp mời."
          );
        }, 2100);
      }, [collectedElements.length]);

      const handleOpenChest = useCallback(() => {
        soundEngine.playChestOpen();
        setStage("chest_opened");
        setQuestFeedback("Rương thiệp mời đã mở! Kéo xuống hoặc nhấn nút bên dưới để xem chi tiết thiệp mời.");
      }, []);

      const handleSkipToChest = () => {
        soundEngine.playCraft();
        setCollectedElements(["Al", "Fe2O3", "Mg"]);
        setStage("chest_opened");
        setPostBurnQuoteVisible(true);
        setQuestFeedback("Đã kích hoạt Phản ứng Nhiệt Nhôm & mở Rương Thiệp Mời Kỷ Yếu 2026!");
      };

      const handleAcceptInvitation = () => {
        soundEngine.playFirework();
        setAccepted(true);
        setStage("celebrate");
        setFireworksActive(true);
        setTimeout(() => setFireworksActive(false), 3200);
      };

      const handleCopyPhone = () => {
        soundEngine.playClick();
        const textArea = document.createElement("textarea");
        textArea.value = INVITATION_CONFIG.phone;
        document.body.appendChild(textArea);
        textArea.select();
        try {
          document.execCommand("copy");
          setCopiedToast(true);
          setTimeout(() => setCopiedToast(false), 2500);
        } catch (err) {
          console.warn("Copy failed", err);
        }
        document.body.removeChild(textArea);
      };

      const jumpToSection = (id) => {
        soundEngine.playClick();
        const el = document.getElementById(id);
        if (el) el.scrollIntoView({ behavior: "smooth" });
      };

      return (
        <div className="min-h-screen bg-midnight text-warmWhite selection:bg-emerald-500 selection:text-slate-950">
          <PixelFireworksCanvas active={fireworksActive} />

          <TopControlHUD
            isPlaying={isPlaying}
            isMuted={isMuted}
            volume={volume}
            lowGraphics={lowGraphics}
            trackName={trackName}
            onToggleMusic={() => setIsPlaying(soundEngine.toggleMusic())}
            onUploadMp3={handleUploadMp3}
            onToggleMute={() => setIsMuted(soundEngine.toggleMute())}
            onChangeVolume={(v) => {
              setVolume(v);
              soundEngine.setVolume(v);
            }}
            onToggleGraphics={() => {
              soundEngine.playClick();
              setLowGraphics((prev) => !prev);
            }}
            onJumpSection={jumpToSection}
          />

          <section id="hero-lab" className="relative w-full h-screen min-h-[640px] overflow-hidden">
            <div className="absolute inset-0 z-0">
              <MinecraftLab3DScene
                stage={stage}
                collectedElements={collectedElements}
                onCollectElement={handleCollectElement}
                onClickCraftingTable={handleSynthesize}
                onOpenChest={handleOpenChest}
                skyMood={skyMood}
                lowGraphics={lowGraphics}
              />
            </div>

            <div className="absolute inset-0 bg-gradient-to-t from-midnight via-transparent to-midnight/45 pointer-events-none z-10" />

            {stage === "thermite_ignited" && (
              <div className="absolute inset-0 z-15 pointer-events-none bg-gradient-to-t from-amber-500/35 via-orange-400/20 to-white/25 animate-pulse" />
            )}

            {stage === "intro" && (
              <div className="relative z-20 h-full flex flex-col items-center justify-center text-center px-4">
                <div className="voxel-panel rounded-3xl p-7 sm:p-11 max-w-2xl border-2 border-amber-400/45 animate-float-slow">
                  <div className="inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-amber-500/15 border border-amber-400/40 font-pixel text-[11px] sm:text-xs text-amber-300 mb-4">
                    <span>MINECRAFT SHADERS × THERMITE ALCHEMY</span>
                  </div>

                  <h1 className="font-pixel text-3xl sm:text-5xl md:text-6xl text-warmWhite tracking-wide leading-tight mb-2">
                    {INVITATION_CONFIG.projectName}
                  </h1>

                  <p className="font-pixel text-xs sm:text-sm text-cyan-300 tracking-widest mb-3">
                    {INVITATION_CONFIG.subtitle}
                  </p>

                  <div className="inline-block px-3 py-1 rounded-lg bg-orange-500/20 border border-orange-400/40 font-pixel text-xs text-amber-200 mb-3">
                    {INVITATION_CONFIG.thermiteEquation}
                  </div>

                  <blockquote className="max-w-xl mx-auto my-4 px-4 py-3.5 rounded-2xl bg-gradient-to-r from-amber-500/15 via-emerald-500/10 to-amber-500/15 border border-amber-300/35 text-amber-100 text-sm sm:text-base md:text-lg font-semibold leading-relaxed italic shadow-lg">
                    "{INVITATION_CONFIG.thermiteQuote}"
                  </blockquote>

                  <div className="font-pixel text-lg sm:text-xl text-emerald-300 mb-6">
                    {INVITATION_CONFIG.dateDots} • {INVITATION_CONFIG.location}
                  </div>

                  <button
                    onClick={handleEnterWorld}
                    className="voxel-btn px-8 py-4 rounded-2xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-pixel text-sm sm:text-base font-bold shadow-voxel-emerald tracking-wider"
                  >
                    ENTER THE WORLD ▶
                  </button>
                </div>
              </div>
            )}

            {stage !== "intro" && (
              <div className="relative z-20 h-full flex flex-col justify-between pt-20 pb-6 px-4 sm:px-6 pointer-events-none">
                <div className="max-w-4xl mx-auto w-full flex flex-col items-center gap-2 pointer-events-auto">
                  <div className="voxel-panel rounded-2xl px-4 py-3 border border-amber-400/40 text-center">
                    <div className="font-pixel text-[10px] text-amber-300 tracking-wider mb-1">
                      {INVITATION_CONFIG.thermiteEquation}
                    </div>
                    <p className="text-xs sm:text-sm text-warmWhite font-medium">
                      {questFeedback}
                    </p>
                  </div>

                  {postBurnQuoteVisible && (
                    <div className="voxel-panel rounded-2xl px-5 py-3.5 max-w-2xl border-2 border-amber-300/60 bg-gradient-to-r from-amber-500/20 via-orange-500/15 to-emerald-500/20 text-center shadow-voxel-gold animate-float-slow">
                      <div className="font-pixel text-[10px] text-amber-300 tracking-widest mb-1">
                        ✦ AFTER THE TRANSFORMATION ✦
                      </div>
                      <p className="text-xs sm:text-base md:text-lg text-amber-100 font-semibold italic leading-snug">
                        "{INVITATION_CONFIG.postBurnQuote}"
                      </p>
                    </div>
                  )}

                  <div className="voxel-panel px-2 py-1 rounded-xl flex items-center gap-1 text-[10px] font-pixel">
                    <span className="text-slate-400 px-1.5">SHADER SKY:</span>
                    {[
                      { id: "dawn", label: "DAWN" },
                      { id: "golden", label: "GOLDEN HOUR" },
                      { id: "night", label: "STARLIGHT" }
                    ].map((m) => (
                      <button
                        key={m.id}
                        onClick={() => {
                          soundEngine.playClick();
                          setSkyMood(m.id);
                        }}
                        className={`px-2.5 py-1 rounded-lg transition-colors ${
                          skyMood === m.id
                            ? "bg-amber-400 text-slate-950 font-bold"
                            : "text-slate-300 hover:bg-white/10"
                        }`}
                      >
                        {m.label}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="max-w-4xl mx-auto w-full pointer-events-auto">
                  <div className="voxel-panel rounded-2xl p-4 sm:p-5 border border-white/15 flex flex-col md:flex-row items-center justify-between gap-4">
                    <div className="flex items-center gap-3">
                      <span className="font-pixel text-[11px] text-slate-400 hidden sm:inline">
                        REACTANTS:
                      </span>
                      {[
                        { sym: "Al", label: "Al", name: "Nhôm (Aluminum)", color: "border-cyan-400 text-cyan-300 bg-cyan-500/20" },
                        { sym: "Fe2O3", label: "Fe₂O₃", name: "Sắt(III) oxit", color: "border-orange-400 text-orange-300 bg-orange-500/20" },
                        { sym: "Mg", label: "Mg", name: "Dải Magie mồi lửa", color: "border-amber-400 text-amber-300 bg-amber-500/20" }
                      ].map((el) => {
                        const hasIt = collectedElements.includes(el.sym);
                        return (
                          <button
                            key={el.sym}
                            onClick={() => handleCollectElement(el.sym)}
                            title={`Click để thu thập ${el.name}`}
                            className={`px-3 h-12 min-w-[3.4rem] rounded-xl border-2 font-pixel text-xs sm:text-sm font-bold transition-all flex flex-col items-center justify-center ${
                              hasIt
                                ? `${el.color} scale-105 shadow-lg`
                                : "border-dashed border-slate-600 text-slate-500 hover:border-slate-400 hover:text-slate-300"
                            }`}
                          >
                            <span>{el.label}</span>
                            <span className="text-[8px] font-sans">{hasIt ? "✓" : "+"}</span>
                          </button>
                        );
                      })}
                    </div>

                    <div className="flex flex-wrap items-center justify-center gap-2.5">
                      {stage === "lab" && !allElementsCollected && (
                        <button
                          onClick={handleSkipToChest}
                          className="px-3.5 py-2.5 rounded-xl bg-white/10 hover:bg-white/15 text-slate-300 font-pixel text-[11px] transition-colors"
                        >
                          MỞ NHANH RƯƠNG ⏭
                        </button>
                      )}

                      {stage === "lab" && allElementsCollected && (
                        <button
                          onClick={handleSynthesize}
                          className="voxel-btn px-5 py-3 rounded-xl bg-gradient-to-r from-orange-500 to-amber-400 hover:from-orange-400 hover:to-amber-300 text-slate-950 font-pixel text-xs font-bold shadow-voxel-gold animate-bounce"
                        >
                          IGNITE THERMITE 🔥
                        </button>
                      )}

                      {stage === "thermite_ignited" && (
                        <div className="px-5 py-3 rounded-xl bg-amber-400/20 border border-amber-300 font-pixel text-xs text-amber-200 animate-pulse">
                          2500°C CHUYỂN HÓA...
                        </div>
                      )}

                      {stage === "crafted" && (
                        <button
                          onClick={handleOpenChest}
                          className="voxel-btn px-5 py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-pixel text-xs font-bold shadow-voxel-emerald animate-pulse"
                        >
                          OPEN TREASURE CHEST ✦
                        </button>
                      )}

                      {(stage === "chest_opened" || stage === "celebrate") && (
                        <button
                          onClick={() => jumpToSection("invitation-section")}
                          className="voxel-btn px-5 py-3 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-pixel text-xs font-bold shadow-voxel-gold"
                        >
                          XEM THIỆP MỜI CHI TIẾT ↓
                        </button>
                      )}
                    </div>
                  </div>
                </div>
              </div>
            )}
          </section>

          <main className="relative z-10">
            <InvitationCardSection
              accepted={accepted}
              onAcceptInvitation={handleAcceptInvitation}
              onViewSchedule={() => jumpToSection("timeline-section")}
              onCopyPhone={handleCopyPhone}
              copiedToast={copiedToast}
            />

            <CountdownSection />

            <TimelineSection />

            <GallerySection />

            <GuestbookSection />
          </main>

          <footer className="border-t border-white/10 bg-slate-950/90 py-12 px-4 sm:px-6 text-center">
            <div className="max-w-4xl mx-auto">
              <div className="font-pixel text-lg sm:text-xl text-emerald-300 mb-2">
                {INVITATION_CONFIG.projectName} • {INVITATION_CONFIG.eventName}
              </div>
              <p className="text-slate-400 text-sm mb-4">
                Tổ chức bởi <span className="text-warmWhite font-semibold">{INVITATION_CONFIG.organizer}</span> •{" "}
                {INVITATION_CONFIG.location} • Ngày {INVITATION_CONFIG.dateDisplay} ({INVITATION_CONFIG.startTime} – {INVITATION_CONFIG.endTime})
              </p>
              <div className="font-pixel text-xs text-amber-300">
                HOTLINE: {INVITATION_CONFIG.phone}
              </div>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
